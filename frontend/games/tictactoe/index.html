<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | MiniHub</title>

    <link rel="stylesheet" href="tictactoe.css">
</head>

<body>
    <a href="../../index.html" class="back-btn">← MiniHub</a>

    <div class="game-container">

        <header class="game-header">
            <a href="../../pages/dashboard.html" class="back-btn">
                ← Back to MiniHub
            </a>

            <div class="game-title">
                <span class="game-icon">❌</span>

                <div>
                    <h1>Tic Tac Toe</h1>
                    <p>Beat the computer.</p>
                </div>
            </div>
        </header>


        <main class="game-main">

            <section class="game-card">

                <div class="scoreboard">

                    <div class="score-card player">
                        <span class="score-label">YOU</span>
                        <span class="score-value" id="playerScore">0</span>
                        <span class="score-symbol">X</span>
                    </div>

                    <div class="score-card draws">
                        <span class="score-label">DRAW</span>
                        <span class="score-value" id="drawScore">0</span>
                        <span class="score-symbol">—</span>
                    </div>

                    <div class="score-card computer">
                        <span class="score-label">COMPUTER</span>
                        <span class="score-value" id="computerScore">0</span>
                        <span class="score-symbol">O</span>
                    </div>

                </div>


                <div class="status" id="status">
                    Your turn
                </div>


                <div class="board" id="board">

                    <button class="cell" data-index="0"></button>
                    <button class="cell" data-index="1"></button>
                    <button class="cell" data-index="2"></button>

                    <button class="cell" data-index="3"></button>
                    <button class="cell" data-index="4"></button>
                    <button class="cell" data-index="5"></button>

                    <button class="cell" data-index="6"></button>
                    <button class="cell" data-index="7"></button>
                    <button class="cell" data-index="8"></button>

                </div>


                <div class="game-controls">

                    <button id="newGameBtn" class="primary-btn">
                        New Game
                    </button>

                    <button id="resetScoresBtn" class="secondary-btn">
                        Reset Scores
                    </button>

                </div>

            </section>


            <section class="info-card">

                <h2>How to Play</h2>

                <div class="rule">
                    <span>1</span>
                    <p>You play as <strong>X</strong>.</p>
                </div>

                <div class="rule">
                    <span>2</span>
                    <p>The computer plays as <strong>O</strong>.</p>
                </div>

                <div class="rule">
                    <span>3</span>
                    <p>Get three symbols in a row to win.</p>
                </div>

                <div class="rule">
                    <span>4</span>
                    <p>Win as many games as you can.</p>
                </div>

            </section>

        </main>

    </div>


    <script src="../../js/api.js"></script>
    <script src="tictactoe.js"></script>

</body>
</html>
