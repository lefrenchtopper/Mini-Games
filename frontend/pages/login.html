<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>MiniHub | Sign In</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <nav>
      <a class="logo" href="../index.html"
        ><span class="logo-icon">🎮</span
        ><span><b>MINIHUB</b><small>ARCADE & MORE</small></span></a
      >
      <div class="nav-links">
        <a href="../index.html">Home</a
        ><a href="leaderboard.html">Leaderboard</a
        ><a href="profile.html">Profile</a>
      </div>
      <div class="nav-auth">
        <a href="login.html" class="login-btn">Sign In</a
        ><a href="signup.html" class="signup-btn">Sign Up</a>
      </div>
    </nav>
    <main class="auth-page">
      <div class="auth-card">
        <div class="section-label">WELCOME BACK</div>
        <h1>Sign in</h1>
        <p>Enter your MiniHub account details.</p>
        <form onsubmit="login(event)">
          <div class="field">
            <label>EMAIL</label>
            <input id="identifier" type="email" required />
          </div>
          <div class="field">
            <label>PASSWORD</label
            ><input id="password" type="password" required />
          </div>
          <button class="primary-btn" type="submit">Sign In</button>
        </form>
        <div class="auth-link">
          Don't have an account? <a href="signup.html">Create one</a>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
      async function login(e) {
        e.preventDefault();

        const email = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value;

        try {
          await loginUser(email, password);

          window.location.href = "dashboard.html";
        } catch (error) {
          console.error("Login error:", error);
          alert(error.message);
        }
      }
    </script>
  </body>
</html>
