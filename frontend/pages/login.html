<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>MiniHub | Sign In</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/arcade.css" />
  </head>
  <body class="auth-shell">
    <header class="auth-entry-nav">
      <a class="auth-entry-home" href="../index.html"><span>◈</span> MINIHUB</a>
      <a class="auth-entry-link" href="signup.html">Create account</a>
    </header>
    <main class="auth-page">
      <div class="auth-card">
        <div class="section-label">WELCOME BACK</div>
        <h1>Welcome back</h1>
        <p>Enter your MiniHub account details.</p>
        <form onsubmit="login(event)">
          <div class="field">
            <label>EMAIL</label>
            <input id="identifier" type="email" required />
          </div>
          <div class="field">
            <label>PASSWORD</label
            ><input id="password" type="password" required />
          </div>
          <button class="primary-btn" type="submit">Sign In</button>
        </form>
        <div class="auth-link">
          Don't have an account? <a href="signup.html">Create one</a>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>

    <script>
      async function login(e) {
        e.preventDefault();

        const email = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value;

        try {
          await loginUser(email, password);

          window.location.href = "dashboard.html";
        } catch (error) {
          console.error("Login error:", error);
          alert(error.message);
        }
      }
    </script>
  </body>
</html>
